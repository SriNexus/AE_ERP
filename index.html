<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neozy</title>
    <meta name="description" content="Neozy Business Operating System - Enterprise Resource Planning" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' x='50%' text-anchor='middle' font-size='60' font-family='Arial' font-weight='bold' fill='%23fff'>N</text></svg>" />
    <!-- No-flash theme: applies the resolved theme before React renders. -->
    <script>
      (function(){
        var m=localStorage.getItem('neozy-theme-mode')||'system';
        var d=m==='dark'||(m==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        if(d) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
