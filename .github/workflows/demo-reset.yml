name: Guarded Demo Reset
# Demo-to-Group conversion (docs/reports/NEOZY_DEMO_GROUP_CONVERSION_REPORT.md):
# Neozy Demo is now the real, persistent testing Group (replacing Ashish
# Enterprises), not a public sandbox that resets itself. An automatic nightly
# wipe-and-reseed would destroy real testing data, which no normal Group's
# data is ever subject to — so the schedule trigger is removed. The
# reset/reseed capability itself is kept available as an explicit,
# operator-triggered maintenance action (workflow_dispatch), the same way any
# Group's data could be reset by an administrator on purpose.
on:
  workflow_dispatch: {}
concurrency:
  group: neozy-public-demo-reset
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_FIREBASE_PROJECT_ID: ${{ vars.DEMO_FIREBASE_PROJECT_ID }}
      DEMO_ALLOWED_FIREBASE_PROJECTS: ${{ vars.DEMO_ALLOWED_FIREBASE_PROJECTS }}
      DEMO_RESET_SCHEDULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEMO_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEMO_GCP_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm run demo:seed
      - run: npm run demo:reset -- --apply --confirm=RESET-company-demo-neozy
